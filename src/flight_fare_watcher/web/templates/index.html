{% extends "base.html" %}
{% block title %}Search - Flight Fare Watcher{% endblock %}
{% block content %}
  <h1>Search flights</h1>
  <form id="search-form" class="card">
    <div class="field-row">
      <label>
        From (IATA code)
        <input type="text" id="origin" maxlength="3" placeholder="JFK" required>
      </label>
      <label>
        To (IATA code)
        <input type="text" id="destination" maxlength="3" placeholder="LAX" required>
      </label>
    </div>
    <div class="field-row">
      <label>
        Depart date
        <input type="date" id="depart_date" required>
      </label>
      <label>
        Return date (optional)
        <input type="date" id="return_date">
      </label>
    </div>
    <button type="submit">Search</button>
  </form>

  <div id="search-status" class="status" hidden></div>
  <div id="site-statuses" class="site-statuses"></div>

  <table id="results-table" class="results" hidden>
    <thead>
      <tr>
        <th>Price</th>
        <th>Airline</th>
        <th>Site</th>
        <th>Book</th>
        <th>Watch this route</th>
      </tr>
    </thead>
    <tbody id="results-body"></tbody>
  </table>
{% endblock %}
{% block scripts %}
  <script src="/static/app.js"></script>
{% endblock %}
